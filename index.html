<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Task-1</title>
</head>
<body>
    <div class="container">
    <header>
        <div class="header">
            <div class="logo">Beginner HTML</div>
            <div>
                <nav class="header_nav">
                    <a href="#home" class="nav">Home</a>
                    <a href="#tutorials" class="nav">Tutorials</a>
                    <a href="#examples" class="nav">Examples</a>
                    <a href="#contact" class="nav">Contact</a>
                    <a href="#reachout" class="nav">Reach out</a>
                </nav>
            </div>
        </div>
    </header>
    <hr>

    <div class="feedback">
        <p>We'd love your <br>feedback!</p>
        <hr>
    </div>

    <main class="main">
        <div class="forms">
            <form action="">
                <label for="name">Full Name</label><br>
                <input class="input" type="text" id="name" name="name" placeholder="Enter your name"><br>

                <label for="email">Email Address</label><br>
                <input class="input" type="email" id="email" name="email" placeholder="your.email@example.com"><br>

                <label for="subject">Share your thoughts</label><br>
                <textarea class="textarea" name="subject" placeholder="What did you learn?" ></textarea><br><br>

                <label for="topics">What topics interesr you?</label><br><br>
                <div class="checkbox">
                    <div class="checkbox-1">
                    <input type="checkbox" name="topics" id="topics" >HTML Basics <br>
                    <input type="checkbox" name="topics" id="topics">HTML Forms <br>
                    <input type="checkbox" name="topics" id="topics">HTML Best  <br>    
                    </div>
                    <div class="checkbox-2">
                    <input type="checkbox" name="topics" id="topics">HTML Elements<br>
                    <input type="checkbox" name="topics" id="topics">HTML Attributes<br>
                    <input type="checkbox" name="topics" id="topics">HTML Resource<br><br>
                    </div>
                </div><br>
                <input type="submit" value="Submit" class="submit">
            </form>
        </div>
        <div class="img">
            <img src="leon.jpg" alt="">
        </div>
    </main>
    </div>
</body>
</html>
